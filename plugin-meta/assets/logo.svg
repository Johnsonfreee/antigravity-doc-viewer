<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <clipPath id="squircleClip">
      <rect x="6" y="6" width="116" height="116" rx="28"/>
    </clipPath>
    <linearGradient id="bgGrad" x1="14" y1="10" x2="114" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(26 24) rotate(45) scale(108)">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="backSheetGrad" x1="18" y1="22" x2="82" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="24" y1="20" x2="88" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="paperShadow" x="12" y="12" width="88" height="106" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.5" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <filter id="dockShadow" x="52" y="52" width="70" height="70" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#020617" flood-opacity="0.58"/>
    </filter>
  </defs>

  <!-- Outer rounded squircle container -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#glowGrad)"/>

  <g clip-path="url(#squircleClip)">
    <!-- Back translucent glass sheet (Worktree / layered drafts) -->
    <g transform="rotate(-7 54 62)">
      <rect x="20" y="22" width="60" height="78" rx="9" fill="url(#backSheetGrad)" stroke="#93C5FD" stroke-opacity="0.45" stroke-width="1.2"/>
    </g>

    <!-- Main A4 paper sheet -->
    <g filter="url(#paperShadow)">
      <path d="M33 20H72L88 36V93C88 97.9706 83.9706 102 79 102H33C28.0294 102 24 97.9706 24 93V29C24 24.0294 28.0294 20 33 20Z" fill="url(#paperGrad)"/>
      <!-- Dog-ear folded corner -->
      <path d="M72 20V31C72 33.7614 74.2386 36 77 36H88L72 20Z" fill="#93C5FD"/>
      <path d="M72 20L88 36H77C74.2386 36 72 33.7614 72 31V20Z" fill="#BFDBFE" fill-opacity="0.65"/>
    </g>

    <!-- Document content lines & mini structured grid -->
    <rect x="33" y="33" width="28" height="5.5" rx="2.75" fill="#2563EB"/>
    <rect x="33" y="45" width="44" height="4" rx="2" fill="#94A3B8"/>
    <rect x="33" y="53" width="36" height="4" rx="2" fill="#CBD5E1"/>

    <!-- Mini 2-row table / grid block -->
    <rect x="33" y="64" width="25" height="22" rx="3.5" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
    <path d="M33 71.5H58M33 78.8H58M44 64V86" stroke="#93C5FD" stroke-width="1"/>
    <rect x="35.5" y="66.2" width="6.2" height="3" rx="1.2" fill="#3B82F6"/>

    <!-- Floating 2x2 Office & PDF Suite Dock -->
    <g filter="url(#dockShadow)">
      <rect x="62" y="60" width="50" height="50" rx="13" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    </g>

    <!-- Tile 1: Word (W) -->
    <rect x="66" y="64" width="19" height="19" rx="5" fill="#2563EB"/>
    <path d="M69.8 68.8L72.3 78.2L75.5 71.3L78.7 78.2L81.2 68.8" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Tile 2: Excel (X) -->
    <rect x="89" y="64" width="19" height="19" rx="5" fill="#16A34A"/>
    <path d="M94 69L103 78M103 69L94 78" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Tile 3: PowerPoint (P) -->
    <rect x="66" y="87" width="19" height="19" rx="5" fill="#EA580C"/>
    <path d="M72.2 101.3V91.7H76.2A2.6 2.6 0 0 1 76.2 96.9H72.2" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Tile 4: PDF (Minimalist page glyph) -->
    <rect x="89" y="87" width="19" height="19" rx="5" fill="#E11D48"/>
    <path d="M94.2 90.8H99.6L102.8 94V102.2H94.2V90.8Z" fill="#FFFFFF"/>
    <path d="M99.4 90.8V94.2H102.8L99.4 90.8Z" fill="#FDA4AF"/>
    <path d="M96.1 96.5H100.9M96.1 99.2H99.4" stroke="#E11D48" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Crisp outer border stroke -->
  <rect x="6" y="6" width="116" height="116" rx="28" stroke="url(#borderGrad)" stroke-width="1.5"/>
</svg>
